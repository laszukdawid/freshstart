version: 3

vars:
  SHELL: bash
  SHELL_CFG: ~/.bashrc

tasks:
  # PREP
  prep:alias:
    desc: Add common and OS-specific aliases to .bashrc
    requires:
      vars: [ALIAS_FLAVOUR]
    status:
      - cmp -s alias/common ~/.dotfiles/.alias.common
      - cmp -s alias/{{.ALIAS_FLAVOUR}} ~/.dotfiles/.alias.{{.ALIAS_FLAVOUR}}
      - grep -qxF 'source ~/.dotfiles/.alias.common' {{.SHELL_CFG}}
      - grep -qxF 'source ~/.dotfiles/.alias.{{.ALIAS_FLAVOUR}}' {{.SHELL_CFG}}
      - "! grep -qxF 'source ~/.dotfiles/.alias' {{.SHELL_CFG}}"
    cmds:
      - mkdir -p ~/.dotfiles
      - cp alias/common ~/.dotfiles/.alias.common
      - cp alias/{{.ALIAS_FLAVOUR}} ~/.dotfiles/.alias.{{.ALIAS_FLAVOUR}}
      - sed -i '\|source ~/.dotfiles/.alias$|d' {{.SHELL_CFG}}
      - grep -qxF 'source ~/.dotfiles/.alias.common' {{.SHELL_CFG}} || printf '\n# Common aliases\nsource ~/.dotfiles/.alias.common\n' >> {{.SHELL_CFG}}
      - grep -qxF 'source ~/.dotfiles/.alias.{{.ALIAS_FLAVOUR}}' {{.SHELL_CFG}} || printf '\n# {{.ALIAS_FLAVOUR}} aliases\nsource ~/.dotfiles/.alias.{{.ALIAS_FLAVOUR}}\n' >> {{.SHELL_CFG}}

  # TERMINAL
  install:kitty:
    desc: Install Kitty terminal emulator
    status:
      - kitty --version
    cmds:
      - curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
      - mkdir -p ~/.local/bin
      - ln -sf ~/.local/kitty.app/bin/kitty ~/.local/kitty.app/bin/kitten ~/.local/bin/
      - cp ~/.local/kitty.app/share/applications/kitty.desktop ~/.local/share/applications/
      - cp ~/.local/kitty.app/share/applications/kitty-open.desktop ~/.local/share/applications/
      - sed -i "s|Icon=kitty|Icon=$(readlink -f ~)/.local/kitty.app/share/icons/hicolor/256x256/apps/kitty.png|g" ~/.local/share/applications/kitty*.desktop
      - sed -i "s|Exec=kitty|Exec=$(readlink -f ~)/.local/kitty.app/bin/kitty|g" ~/.local/share/applications/kitty*.desktop
      - echo 'kitty.desktop' > ~/.config/xdg-terminals.list

  # SHELL UTILITIES
  install:z:
    desc: Install Z script for directory navigation
    preconditions:
      - curl --version
      - test -f {{.SHELL_CFG}}
    status:
      - test -f ~/.dotfiles/z
      - grep -q 'source ~/.dotfiles/z' {{.SHELL_CFG}}
    cmds:
      - mkdir -p ~/.dotfiles
      - curl -o ~/.dotfiles/z https://raw.githubusercontent.com/laszukdawid/z/master/z.sh
      - chmod a+x ~/.dotfiles/z
      - printf '\n# Z script\n' >> {{.SHELL_CFG}}
      - printf 'source ~/.dotfiles/z\n' >> {{.SHELL_CFG}}

  install:starship:
    desc: Install Starship prompt (https://starship.rs/)
    preconditions:
      - curl --version
      - test -f {{.SHELL_CFG}}
    status:
      - starship --version
      - grep -q 'eval "$(starship init {{.SHELL}})"' {{.SHELL_CFG}}
    cmds:
      - curl -sS https://starship.rs/install.sh | sh -s -- -y
      - printf '\n# Starship prompt\n' >> {{.SHELL_CFG}}
      - printf 'eval "$(starship init {{.SHELL}})"\n' >> {{.SHELL_CFG}}

  # VIM
  install:vim:config:
    desc: Configure Vim/Neovim with custom vimrc and Pathogen
    cmds:
      - curl -o ~/.vimrc https://gist.githubusercontent.com/laszukdawid/059ae4c41f516e206832637e5215fe6f/raw/8dfdf85184b0afd9e1550afea99848a7482f4bd5/.vimrc
      - mkdir -p ~/.vim/autoload ~/.vim/bundle
      - curl -LSso ~/.vim/autoload/pathogen.vim https://tpo.pe/pathogen.vim
      - mkdir -p ~/.config/nvim
      - |
        cat >> ~/.config/nvim/init.vim << EOF
        set runtimepath^=~/.vim runtimepath+=~/.vim/after
        let &packpath = &runtimepath
        source ~/.vimrc
        EOF

  # LANGUAGE VERSION MANAGER
  install:lang:manager:
    desc: Install mise as a language version manager (https://mise.jdx.dev/)
    status:
      - command -v mise >/dev/null || test -x ~/.local/bin/mise
      - grep -q 'eval "$(mise activate {{.SHELL}})"' {{.SHELL_CFG}}
      - >-
        ! grep -qE '(asdf\.sh|asdf completion|ASDF_DATA_DIR|FLUTTER_ROOT=.*asdf)' {{.SHELL_CFG}}
    cmds:
      - command -v mise >/dev/null || curl -fsSL https://mise.run | sh
      - sed -i -E '\|(asdf\.sh|asdf completion|ASDF_DATA_DIR|FLUTTER_ROOT=.*asdf)|d' {{.SHELL_CFG}}
      - grep -q 'eval "$(mise activate {{.SHELL}})"' {{.SHELL_CFG}} || printf '\n# Mise\neval "$(mise activate {{.SHELL}})"\n' >> {{.SHELL_CFG}}

  install:lang:python:
    desc: Install Python via mise
    preconditions:
      - command -v mise >/dev/null || test -x ~/.local/bin/mise
    env:
      PYTHON_VERSION: latest
    cmds:
      - MISE_BIN=$(command -v mise || printf '%s' "$HOME/.local/bin/mise"); "$MISE_BIN" use --global python@$PYTHON_VERSION

  install:lang:golang:
    desc: Install Go via mise
    preconditions:
      - command -v mise >/dev/null || test -x ~/.local/bin/mise
    env:
      GO_VERSION: latest
    cmds:
      - MISE_BIN=$(command -v mise || printf '%s' "$HOME/.local/bin/mise"); "$MISE_BIN" use --global go@$GO_VERSION

  install:lang:flutter:
    desc: Install Flutter SDK via mise
    preconditions:
      - command -v mise >/dev/null || test -x ~/.local/bin/mise
    cmds:
      - MISE_BIN=$(command -v mise || printf '%s' "$HOME/.local/bin/mise"); "$MISE_BIN" use --global flutter@latest

  # PYTHON TOOLS
  python:install:uv:
    desc: Install uv for Python
    status:
      - uv --version
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh

  # DOCKER POST-INSTALL (common for both OSes)
  install:docker:post:
    desc: Configure Docker to run without sudo
    status:
      - docker run hello-world
    cmds:
      - sudo groupadd docker || true
      - sudo usermod -aG docker $USER
      - echo "Please log out and back in for Docker group changes to take effect"
